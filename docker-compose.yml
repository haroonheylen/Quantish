services:
#PostgreSQL Database Service
  db: 
    image: postgres:16-alpine #postgresql-16
    container_name: quantish-db
    restart: unless-stopped #only stop when deliberately asked to
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432" #ports host:container
    volumes:
      - db_data:/var/lib/postgresql/data #Postgre directory
    healthcheck: #Wait until postgre setup before accepting connections
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
#NestJS API Service
  api:
    build:
      context: ./api
    container_name: quantish-api
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      # busybox wget ships with the alpine image, so no extra install.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
# Vue Web Service
  web:
    build:
      context: ./web
    container_name: quantish-web
    restart: unless-stopped
    ports:
      - "8080:80"
    # Don't serve the UI until the API answers its health check.
    depends_on:
      api:
        condition: service_healthy
volumes:
  db_data: