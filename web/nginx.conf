server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Same /api prefix as the Vite proxy, so the frontend code is identical in
    # dev and in Docker. The trailing slash on proxy_pass strips "/api".
    # "api" resolves to the API container on the Compose network.
    location /api/ {
        proxy_pass http://api:3000/;
    }

    # Vue Router uses real URLs like /articles/abc. If someone refreshes on one,
    # nginx has no such file, so fall back to index.html and let Vue route it.
    location / {
        try_files $uri $uri/ /index.html;
    }
}